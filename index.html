<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="ProfileHub — a modern, premium user profile management dashboard with Create, Read, Update, Delete, Search and more." />
    <meta name="theme-color" content="#4f46e5" />
    <title>ProfileHub · Profile Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme') || 'light';
          if (t !== 'light' && t !== 'dark' && t !== 'aurora') t = 'light';
          document.documentElement.setAttribute('data-theme', t);
          if (t === 'dark' || t === 'aurora') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
